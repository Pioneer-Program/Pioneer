plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.116'

    id 'org.sinytra.adapter.userdev' version '1.2.1-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    maven { url = "https://api.modrinth.com/maven/" }
    maven {url 'https://maven.blakesmods.com'}
    maven { url 'https://modmaven.dev/'}
    maven { url 'https://maven.terraformersmc.com/'}
    maven {url 'https://maven.blamejared.com'}

    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url = "https://squiddev.cc/maven"
    }

    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }

    maven {
        name 'luck-repo'
        url 'https://repo.lucko.me/'
        content {
            includeModule 'me.lucko', 'spark-api'
        }
    }

    maven {
        url = "https://squiddev.cc/maven"
    }

    maven {
        url = "https://maven.ryanhcode.dev/releases"
        name = "RyanHCode Maven"
    }

    maven {
        url = "https://maven.caffeinemc.net/releases"
        name = "CaffeineMC"
    }
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            if (project.hasProperty('devName')) {
                programArgument "--username"
                programArgument project.devName
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {

        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mods that must reach the dev run as FILES in run/mods rather than as classpath entries.
// See the note in `dependencies` for why. Anything added here is invisible at compile time,
// so only put mods that Pioneer accesses reflectively (or not at all) in this bucket.
configurations {
    runMods
}

dependencies {

    // RENDERING STUFF
    runMods "maven.modrinth:sodium:mc${minecraft_version}-${sodium_version}-neoforge"
    implementation "maven.modrinth:iris:${iris_version}"

    implementation("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}")
    {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    runMods "curse.maven:iris-veil-compat-1541252:8280410"

    // GAMEPLAY STUFF
    implementation "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    // THINGS TO CHECK IF WE FUCKED UP
    runtimeOnly "maven.modrinth:l6YH9Als:v5qtqRQi" // SPARK TPS
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             sable_version_range    : sable_version_range,
                             veil_version_range     : veil_version_range,
                             iris_version_range     : iris_version_range,
                             irisveil_version_range : irisveil_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(21)
}

def runModsDir = layout.projectDirectory.dir('run/mods')

tasks.register('copyRunMods', Sync) {
    from configurations.runMods
    into runModsDir
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn 'copyRunMods'
}