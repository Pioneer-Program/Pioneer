name: Build

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Set up date-based tag
        run: |
          DATE_TAG="v$(date +'%Y%m%d.%H%M')"
          echo "TAG_NAME=$DATE_TAG" >> $GITHUB_ENV
          echo "{tag}=$DATE_TAG"

      - name: Publish Fabric to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1498848
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: oxECedW5
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          version: auralith-pioneer-alpha-${{ env.TAG_NAME }}
          version-type: release

          game-versions: 1.21.1

          loaders: |
            neoforge

          files: |
            build/libs/auralithpioneerinitiative-*.jar

          retry-attempts: 2
          retry-delay: 10000