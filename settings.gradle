            name = "Sinytra"
            url = "https://maven.sinytra.org/"
        }

    }
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
